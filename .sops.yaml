keys:
  - &key_work 
  - &key_work_workstation 
  - &key_personal 
  - &key_orville age1rn2d32etdp6wa42k9atysxuz3698fflweu3efrn74x790hle2dpswklr9q

creation_rules:
  - path_regex: ^machines/tardis/.*/secrets\.yaml$
    age: *key_personal
  - path_regex: home/work/secrets\.yaml$
    age: *key_work
  - path_regex: home/work-workstation/secrets\.yaml$
    age: *key_work_workstation
  - path_regex: machines/orville/(secrets\.yaml|container-services/.*/secrets\.env)$
    key_groups:
      - age:
          - *key_personal
          - *key_orville

stores:
  yaml:
    indent: 2
